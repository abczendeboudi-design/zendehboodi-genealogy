<head>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f1e8;
      color: #2f2a24;
      line-height: 1.9;
    }

    header {
      background: linear-gradient(135deg, #6b4f35, #8b6a45);
      color: white;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .back {
      display: inline-block;
      margin-top: 12px;
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,.15);
      padding: 7px 15px;
      border-radius: 8px;
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .person-card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    .person-name {
      font-size: 28px;
      font-weight: bold;
      color: #5d432c;
      margin-bottom: 20px;
      border-bottom: 2px solid #dfcfb7;
      padding-bottom: 12px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 25px;
    }

    .info-box {
      background: #faf7f1;
      border: 1px solid #eadfce;
      border-radius: 12px;
      padding: 12px 15px;
    }

    .label {
      font-weight: bold;
      color: #7a5a38;
    }

    h2 {
      color: #62472f;
      font-size: 22px;
      margin-top: 28px;
    }

    .family-section {
      margin-top: 15px;
    }

    .spouse {
      background: #f8f2e9;
      border: 1px solid #e4d5c1;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .spouse-title {
      font-weight: bold;
      font-size: 18px;
      color: #684b30;
      margin-bottom: 10px;
    }

    .children {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .child {
      display: block;
      background: white;
      border: 1px solid #dfd2c0;
      border-radius: 10px;
      padding: 10px 12px;
      text-decoration: none;
      color: #493a2c;
      transition: .2s;
    }

    .child:hover {
      background: #eee4d5;
      transform: translateY(-2px);
    }

    .direct-child {
      display: block;
      margin: 8px 0;
      background: #faf7f1;
      border: 1px solid #e1d5c4;
      border-radius: 10px;
      padding: 10px 14px;
      color: #493a2c;
      text-decoration: none;
    }

    .direct-child:hover {
      background: #eee4d5;
    }

    a.person-link {
      color: #694b2f;
      text-decoration: none;
      font-weight: bold;
    }

    a.person-link:hover {
      text-decoration: underline;
    }

    .not-found {
      background: white;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      color: #8a332c;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    footer {
      text-align: center;
      color: #8a7b69;
      padding: 30px 15px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 22px;
      }

      .person-name {
        font-size: 23px;
      }

      .person-card {
        padding: 18px;
      }
    }
  </style>
</head>
