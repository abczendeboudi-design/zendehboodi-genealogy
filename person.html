  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f1e8;
      color: #2f2a24;
      line-height: 1.9;
    }

    header {
      background: linear-gradient(135deg, #6b4f35, #8b6a45);
      color: white;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,.15);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    .back {
      display: inline-block;
      margin-top: 12px;
      color: white;
      text-decoration: none;
      background: rgba(255,255,255,.15);
      padding: 7px 15px;
      border-radius: 8px;
    }

    .back:hover {
      background: rgba(255,255,255,.25);
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .person-card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      margin-bottom: 25px;
    }

    .person-name {
      font-size: 28px;
      font-weight: bold;
      color: #5d432c;
      margin-bottom: 20px;
      border-bottom: 2px solid #dfcfb7;
      padding-bottom: 12px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 25px;
    }

    .info-box {
      background: #faf7f1;
      border: 1px solid #eadfce;
      border-radius: 12px;
      padding: 12px 15px;
    }

    .label {
      font-weight: bold;
      color: #7a5a38;
    }

    h2 {
      color: #62472f;
      font-size: 22px;
      margin-top: 28px;
    }

    .family-section {
      margin-top: 15px;
    }

    .spouse {
      background: #f8f2e9;
      border: 1px solid #e4d5c1;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .spouse-title {
      font-weight: bold;
      font-size: 18px;
      color: #684b30;
      margin-bottom: 10px;
    }

    .children {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .child {
      display: block;
      background: white;
      border: 1px solid #dfd2c0;
      border-radius: 10px;
      padding: 10px 12px;
      text-decoration: none;
      color: #493a2c;
      transition: .2s;
    }

    .child:hover {
      background: #eee4d5;
      transform: translateY(-2px);
    }

    .direct-child {
      display: block;
      margin: 8px 0;
      background: #faf7f1;
      border: 1px solid #e1d5c4;
      border-radius: 10px;
      padding: 10px 14px;
      color: #493a2c;
      text-decoration: none;
    }

    .direct-child:hover {
      background: #eee4d5;
    }

    a.person-link {
      color: #694b2f;
      text-decoration: none;
      font-weight: bold;
    }

    a.person-link:hover {
      text-decoration: underline;
    }

    .relation-link {
      color: #694b2f;
      font-weight: bold;
      text-decoration: none;
    }

    .relation-link:hover {
      text-decoration: underline;
    }

    .not-found {
      background: white;
      border-radius: 15px;
      padding: 30px;
      text-align: center;
      color: #8a332c;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .empty {
      color: #8a7b69;
      font-size: 14px;
    }

    .family-note {
      background: #faf7f1;
      border: 1px solid #eadfce;
      border-radius: 12px;
      padding: 12px 15px;
      margin-top: 15px;
      color: #6d5b49;
    }

    footer {
      text-align: center;
      color: #8a7b69;
      padding: 30px 15px;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 22px;
      }

      .person-name {
        font-size: 23px;
      }

      .person-card {
        padding: 18px;
      }
    }
  </style>
</head>

/* =========================================================
   توابع کمکی
   ========================================================= */

/*
  اگر شخصی در people وجود داشته باشد،
  نام او به صورت لینک نمایش داده می‌شود.
*/
function personLink(person, cssClass = "person-link") {

  if (!person) {
    return "";
  }

  const name = person.name || "";

  if (person.id && people[person.id]) {
    return `
      <a class="${cssClass}" href="person.html?id=${encodeURIComponent(person.id)}">
        ${escapeHtml(name)}
      </a>
    `;
  }

  return escapeHtml(name);
}


/*
  جلوگیری از ورود HTML ناخواسته داخل نام‌ها
*/
function escapeHtml(text) {

  return String(text ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/*
  نمایش والد
*/
function renderParent(label, parent) {

  if (!parent) {
    return "";
  }

  return `
    <div class="info-box">
      <span class="label">${label}:</span>
      ${personLink(parent)}
    </div>
  `;
}


/*
  نمایش همسر
*/
function renderSpouse(spouse) {

  if (!spouse) {
    return "";
  }

  const spouseName = spouse.name || "همسر";

  const title = spouse.id && people[spouse.id]
    ? personLink(spouse)
    : escapeHtml(spouseName);

  let html = `
    <div class="spouse">

      <div class="spouse-title">
        همسر:
        ${title}
      </div>
  `;

  if (spouse.children && spouse.children.length) {

    html += `
      <div class="children">
    `;

    spouse.children.forEach(child => {

      html += `
        <a class="child"
           href="person.html?id=${encodeURIComponent(child.id)}">
          ${escapeHtml(child.name)}
        </a>
      `;

    });

    html += `
      </div>
    `;

  } else {

    html += `
      <div class="empty">
        فرزندی ثبت نشده است.
      </div>
    `;

  }

  html += `
    </div>
  `;

  return html;
}


/*
  پیدا کردن همسرانی که ممکن است در اطلاعات
  شخص مقابل ثبت شده باشند.
*/
function findSpousesFromData(personId) {

  const result = [];

  Object.entries(people).forEach(([id, data]) => {

    if (!data.spouses) {
      return;
    }

    data.spouses.forEach(spouse => {

      if (spouse.id === personId) {

        if (!result.some(item => item.id === id)) {

          result.push({
            id: id,
            name: data.name
          });

        }

      }

    });

  });

  return result;
}


/*
  نمایش فرزندان مستقیم
  حتی اگر در spouses ثبت نشده باشند.
*/
function collectDirectChildren(personId) {

  const result = [];

  Object.entries(people).forEach(([id, data]) => {

    if (!data) {
      return;
    }

    const fatherMatch =
      data.father &&
      data.father.id === personId;

    const motherMatch =
      data.mother &&
      data.mother.id === personId;

    if (fatherMatch || motherMatch) {

      if (!result.some(child => child.id === id)) {

        result.push({
          id: id,
          name: data.name
        });

      }

    }

  });

  return result;
}


/*
  ترکیب فرزندان ثبت‌شده در spouses
  با فرزندان مستقیم
*/
function collectChildren(personId, data) {

  const result = [];

  if (data.spouses) {

    data.spouses.forEach(spouse => {

      if (spouse.children) {

        spouse.children.forEach(child => {

          if (
            child.id &&
            people[child.id] &&
            !result.some(x => x.id === child.id)
          ) {

            result.push({
              id: child.id,
              name: people[child.id].name
            });

          }

        });

      }

    });

  }

  collectDirectChildren(personId).forEach(child => {

    if (!result.some(x => x.id === child.id)) {

      result.push(child);

    }

  });

  return result;
}


/*
  نمایش صفحه شخص
*/
function renderPerson(personId) {

  const container = document.getElementById("person");

  if (!personId || !people[personId]) {

    container.innerHTML = `
      <div class="not-found">
        <h2>شخص مورد نظر پیدا نشد</h2>
        <p>
          شناسه وارد شده در شجره‌نامه وجود ندارد.
        </p>

        <p>
          <a class="person-link" href="members.html">
            بازگشت به فهرست اعضا
          </a>
        </p>
      </div>
    `;

    return;
  }

  const data = people[personId];

  let html = `
    <div class="person-card">

      <div class="person-name">
        ${escapeHtml(data.name)}
      </div>

      <div class="info">
  `;


  /* =====================================================
     والدین
  ===================================================== */

  html += renderParent("پدر", data.father);
  html += renderParent("مادر", data.mother);

  html += `
      </div>
  `;


  /* =====================================================
     همسران
  ===================================================== */

  let spouses = [];

  if (Array.isArray(data.spouses)) {

    data.spouses.forEach(spouse => {

      if (
        spouse &&
        !spouses.some(x => x.id && spouse.id && x.id === spouse.id)
      ) {

        spouses.push(spouse);

      }

    });

  }


  /*
    اگر در اطلاعات طرف مقابل این شخص به عنوان همسر ثبت شده
    ولی در رکورد فعلی ثبت نشده باشد، خودکار اضافه می‌شود.
  */
  findSpousesFromData(personId).forEach(spouse => {

    if (!spouses.some(x => x.id === spouse.id)) {

      spouses.push(spouse);

    }

  });


  if (spouses.length) {

    html += `
      <h2>همسر و فرزندان</h2>

      <div class="family-section">
    `;

    spouses.forEach(spouse => {

      html += renderSpouse(spouse);

    });

    html += `
      </div>
    `;

  }


  /* =====================================================
     فرزندان مستقیم
  ===================================================== */

  const children = collectChildren(personId, data);

  /*
    فقط وقتی نشان بده که فرزند در spouses
    قبلاً نمایش داده نشده باشد.
  */

  const spouseChildIds = [];

  spouses.forEach(spouse => {

    if (spouse.children) {

      spouse.children.forEach(child => {

        if (child.id) {
          spouseChildIds.push(child.id);
        }

      });

    }

  });

  const directOnlyChildren = children.filter(
    child => !spouseChildIds.includes(child.id)
  );


  if (directOnlyChildren.length) {

    html += `
      <h2>فرزندان</h2>

      <div class="family-section">
    `;

    directOnlyChildren.forEach(child => {

      html += `
        <a class="direct-child"
           href="person.html?id=${encodeURIComponent(child.id)}">
          ${escapeHtml(child.name)}
        </a>
      `;

    });

    html += `
      </div>
    `;

  }


  /* =====================================================
     اگر هیچ اطلاعات خانوادگی وجود نداشت
  ===================================================== */

  const hasFamilyInfo =
    data.father ||
    data.mother ||
    spouses.length ||
    children.length;

  if (!hasFamilyInfo) {

    html += `
      <div class="family-note">
        اطلاعات دیگری برای این شخص ثبت نشده است.
      </div>
    `;

  }


  html += `
    </div>
  `;

  container.innerHTML = html;
}


/* =========================================================
   اجرای صفحه
   ========================================================= */

const params = new URLSearchParams(window.location.search);
const personId = params.get("id");

renderPerson(personId);

</script>
