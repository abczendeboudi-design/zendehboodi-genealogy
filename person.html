  <title>مشخصات فرد</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4eedf;
      color: #243b2a;
    }

    header {
      background: #174b32;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    .back {
      display: inline-block;
      margin-top: 15px;
      padding: 9px 18px;
      background: #f4eedf;
      color: #174b32;
      text-decoration: none;
      border-radius: 20px;
      font-weight: bold;
      font-size: 14px;
    }

    .container {
      max-width: 850px;
      margin: 25px auto;
      padding: 0 15px 40px;
    }

    .profile {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #ddd2bc;
    }

    .name {
      text-align: center;
      color: #174b32;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 25px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .info-box {
      background: #f8f4ea;
      border: 1px solid #ddd2bc;
      border-radius: 12px;
      padding: 13px;
    }

    .label {
      color: #777;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .value {
      font-size: 15px;
      font-weight: bold;
    }

    .section {
      margin-top: 22px;
      background: white;
      border-radius: 18px;
      padding: 20px;
      border: 1px solid #ddd2bc;
    }

    .section h2 {
      margin: 0 0 15px;
      color: #174b32;
      font-size: 18px;
    }

    .person-link {
      display: block;
      background: #f8f4ea;
      border: 1px solid #ddd2bc;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 9px;
      text-decoration: none;
      color: #285f40;
      font-weight: bold;
    }

    .person-link:hover {
      background: #eee6d4;
    }

    .empty {
      color: #777;
      font-size: 14px;
    }

    .error {
      background: white;
      border: 1px solid #d8cbb4;
      border-radius: 18px;
      padding: 30px;
      text-align: center;
    }

    .error h2 {
      color: #174b32;
    }

    @media (max-width: 600px) {
      .info {
        grid-template-columns: 1fr;
      }

      .name {
        font-size: 21px;
      }
    }
  </style>
</head>

/* =========================================================
   توابع نمایش
========================================================= */

function escapeHTML(text) {
  if (text === undefined || text === null) return "";

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* لینک دادن به شخص */

function personLink(person) {

  if (!person) return "";

  if (person.id && people[person.id]) {

    return `
      <a class="person-link"
         href="person.html?id=${encodeURIComponent(person.id)}">

        ${escapeHTML(person.name)}

      </a>
    `;

  }

  return `
    <div class="person-link">
      ${escapeHTML(person.name)}
    </div>
  `;
}


/* =========================================================
   نمایش فرد
========================================================= */

function renderPerson(id) {

  const person = people[id];

  if (!person) {

    document.getElementById("content").innerHTML = `
      <div class="error">

        <h2>فرد موردنظر پیدا نشد</h2>

        <p>
          شناسه این فرد در شجره‌نامه ثبت نشده است.
        </p>

        <a class="back" href="members.html">
          بازگشت به شجره‌نامه
        </a>

      </div>
    `;

    return;
  }


  /* =====================================================
     اطلاعات اصلی
  ===================================================== */

  let html = `
    <div class="profile">

      <div class="name">
        ${escapeHTML(person.name)}
      </div>

      <div class="info">

        <div class="info-box">

          <div class="label">
            شغل
          </div>

          <div class="value">
            اطلاعاتی ثبت نشده
          </div>

        </div>


        <div class="info-box">

          <div class="label">
            تحصیلات
          </div>

          <div class="value">
            اطلاعاتی ثبت نشده
          </div>

        </div>
  `;


  /* =====================================================
     پدر
  ===================================================== */

  if (person.father) {

    html += `
      <div class="info-box">

        <div class="label">
          پدر
        </div>

        <div class="value">

          ${personLink(person.father)}

        </div>

      </div>
    `;
  }


  /* =====================================================
     مادر
  ===================================================== */

  if (person.mother) {

    html += `
      <div class="info-box">

        <div class="label">
          مادر
        </div>

        <div class="value">

          ${personLink(person.mother)}

        </div>

      </div>
    `;
  }


  html += `
      </div>

    </div>
  `;


  /* =====================================================
     همسران
  ===================================================== */

  if (person.spouses && person.spouses.length > 0) {

    html += `
      <div class="section">

        <h2>
          همسر
        </h2>
    `;

    person.spouses.forEach(spouse => {

      html += `
        <div class="person-link">

          ${escapeHTML(spouse.name)}

        </div>
      `;

    });

    html += `
      </div>
    `;
  }


  /* =====================================================
     فرزندان مربوط به هر همسر
  ===================================================== */

  if (
    person.spouses &&
    person.spouses.some(spouse => spouse.children)
  ) {

    person.spouses.forEach(spouse => {

      if (!spouse.children) return;

      html += `
        <div class="section">

          <h2>
            فرزندان از همسر
            ${escapeHTML(spouse.name)}
          </h2>
      `;

      spouse.children.forEach(child => {

        html += personLink(child);

      });

      html += `
        </div>
      `;

    });

  }


  /* =====================================================
     فرزندان مستقیم
  ===================================================== */

  if (
    person.children &&
    person.children.length > 0
  ) {

    html += `
      <div class="section">

        <h2>
          فرزندان
        </h2>
    `;

    person.children.forEach(child => {

      html += personLink(child);

    });

    html += `
      </div>
    `;

  }


  /* =====================================================
     نمایش نهایی
  ===================================================== */

  document.getElementById("content").innerHTML = html;
}


/* =========================================================
   دریافت ID از آدرس
========================================================= */

const params = new URLSearchParams(
  window.location.search
);

const id = params.get("id");


if (id) {

  renderPerson(id);

} else {

  document.getElementById("content").innerHTML = `

    <div class="error">

      <h2>
        فردی انتخاب نشده است
      </h2>

      <p>
        لطفاً از صفحه شجره‌نامه یک نفر را انتخاب کنید.
      </p>

      <a class="back" href="members.html">
        رفتن به شجره‌نامه
      </a>

    </div>

  `;

}

</script>
