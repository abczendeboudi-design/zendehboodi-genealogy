<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>شجره‌نامه روستای قباکلکی</title>

    <meta name="description" content="شجره‌نامه خاندان‌های روستای قباکلکی">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f5f0e6;
            color: #183b2b;
            font-family: Tahoma, Arial, sans-serif;
        }

        a {
            text-decoration: none;
        }

        .header {
            background: #173f2c;
            color: white;
            padding: 55px 20px;
            text-align: center;
            border-bottom: 5px solid #c69a52;
        }

        .header .small-title {
            display: inline-block;
            background: #e7d2a6;
            color: #173f2c;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .header h1 {
            margin: 0;
            font-size: 38px;
            line-height: 1.6;
        }

        .header p {
            margin: 10px 0 0;
            color: #e8eee9;
            font-size: 16px;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: auto;
        }

        .content {
            padding: 45px 0 70px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .section-title h2 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .section-title p {
            margin: 0;
            color: #66736b;
        }

        .family-card {
            display: flex;
            align-items: center;
            gap: 20px;

            background: #fffdf8;
            border: 1px solid #ded5c4;
            border-radius: 24px;

            padding: 25px;

            color: #183b2b;

            box-shadow: 0 12px 35px rgba(24, 59, 43, 0.10);

            transition: all 0.2s ease;
        }

        .family-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 40px rgba(24, 59, 43, 0.16);
            border-color: #b99a68;
        }

        .tree-icon {
            width: 70px;
            height: 70px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #edf2e9;
            border-radius: 20px;

            font-size: 40px;

            flex-shrink: 0;
        }

        .family-info {
            flex: 1;
        }

        .family-info h3 {
            margin: 0 0 8px;
            font-size: 22px;
            line-height: 1.7;
        }

        .family-info p {
            margin: 0;
            color: #66736b;
            font-size: 15px;
        }

        .arrow {
            font-size: 30px;
            color: #216547;
            flex-shrink: 0;
        }

        .footer {
            text-align: center;
            padding: 25px 15px;
            color: #788178;
            font-size: 13px;
        }

        @media (max-width: 700px) {

            .header {
                padding: 40px 18px;
            }

            .header h1 {
                font-size: 29px;
            }

            .header p {
                font-size: 14px;
            }

            .content {
                padding-top: 30px;
            }

            .section-title h2 {
                font-size: 23px;
            }

            .family-card {
                padding: 18px;
                gap: 14px;
            }

            .tree-icon {
                width: 55px;
                height: 55px;
                font-size: 30px;
                border-radius: 15px;
            }

            .family-info h3 {
                font-size: 18px;
            }

            .family-info p {
                font-size: 13px;
            }

            .arrow {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <!-- سربرگ اصلی -->
    <header class="header">

        <div class="small-title">
            شجره‌نامه روستای قباکلکی
        </div>

        <h1>
            خاندان‌های قباکلکی
        </h1>

        <p>
            برای مشاهده شجره‌نامه، خاندان مورد نظر را انتخاب کنید.
        </p>

    </header>


    <!-- محتوای اصلی -->
    <main class="container content">

        <div class="section-title">

            <h2>
                خاندان‌ها
            </h2>

            <p>
                برای شروع، خاندان زیر را انتخاب کنید.
            </p>

        </div>


        <!-- خاندان غلامحسین قاسم -->
        <a
            href="family.html"
            class="family-card"
            aria-label="مشاهده شجره‌نامه خاندان غلامحسین قاسم زائر غلامحسین"
        >

            <div class="tree-icon">
                🌳
            </div>


            <div class="family-info">

                <h3>
                    خاندان غلامحسین قاسم زائر غلامحسین
                </h3>

                <p>
                    مشاهده شجره‌نامه ←
                </p>

            </div>


            <div class="arrow">
                ←
            </div>

        </a>

    </main>


    <!-- پایین صفحه -->
    <footer class="footer">

        شجره‌نامه روستای قباکلکی

    </footer>

</body>
</html>
