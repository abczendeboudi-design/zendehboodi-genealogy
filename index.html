<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شجره‌نامه جامع خاندان قباکلکی (زنده‌بودی‌ها)</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #0d9488;
      --accent: #d97706;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
    }
    body {
      font-family: Tahoma, Vazir, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
    }
    .search-box {
      width: 100%;
      max-width: 450px;
      padding: 12px 18px;
      border: 2px solid #cbd5e1;
      border-radius: 25px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: var(--secondary); }
    
    .family-cards {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      width: 300px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      text-align: center;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.12);
    }
    .card h3 { margin: 0 0 10px 0; color: var(--primary); font-size: 18px; }
    .badge {
      background: var(--secondary);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    /* درخت شجره‌نامه */
    .tree-container {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      max-width: 1100px;
      margin: 0 auto;
    }
    .tree-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    ul.tree, ul.tree ul {
      list-style: none;
      padding-right: 20px;
      margin: 0;
    }
    ul.tree li {
      margin: 10px 0;
      position: relative;
    }
    .person-node {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .person-node:hover { background: #e2e8f0; }
    .has-children::after {
      content: " ➕";
      font-size: 10px;
    }
    .expanded > .person-node::after { content: " ➖"; }
    
    .wife-section {
      margin-top: 10px;
      margin-right: 20px;
      border-right: 3px solid var(--accent);
      padding-right: 12px;
    }
    .wife-title {
      color: var(--accent);
      font-size: 14px;
      font-weight: bold;
      margin: 8px 0;
    }
    .hidden { display: none; }
    .cross-link {
      font-size: 11px;
      background: #e0e7ff;
      color: #3730a3;
      padding: 2px 8px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: normal;
      margin-right: 6px;
    }
    .cross-link:hover { background: #c7d2fe; }
    .highlight { background: #fef08a !important; border-color: #facc15; }
  </style>
</head>
<body>

    <h1>شجره‌نامه جامع خاندان قباکلکی (زنده‌بودی‌ها)</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="جستجوی نام یا نام همسر..." oninput="searchPerson()">
  </header>

    </div>
    <div id="treeView"></div>

                  children: [

    function countMembers(node) {
      let count = 1;
      if (node.wives) {
        node.wives.forEach(w => {
          if (w.children) w.children.forEach(c => count += countMembers(c));
        });
      }
      if (node.children) {
        node.children.forEach(c => count += countMembers(c));
      }
      return count;
    }

    function renderCards() {
      const container = document.getElementById('familyCards');
      container.innerHTML = '';
      familiesData.forEach(fam => {
        const count = countMembers(fam.root);
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => selectFamily(fam.id);
        card.innerHTML = `
          <h3>${fam.title}</h3>
          <span class="badge">تعداد ثبت‌شده: ${count} نفر</span>
        `;
        container.appendChild(card);
      });
    }

    function selectFamily(familyId) {
      const fam = familiesData.find(f => f.id === familyId);
      if (!fam) return;

      document.getElementById('treeContainer').classList.remove('hidden');
      document.getElementById('currentFamilyTitle').innerText = fam.title;
      
      const treeView = document.getElementById('treeView');
      treeView.innerHTML = renderNode(fam.root, true);
    }

    function renderNode(node, isRoot = false) {
      const hasChildren = (node.children && node.children.length > 0) || (node.wives && node.wives.length > 0);
      let html = `<ul class="tree"><li>`;
      
      let nodeClass = `person-node ${hasChildren ? 'has-children' : ''}`;
      html += `<div class="${nodeClass}" onclick="toggleChildren(this)">${node.name}`;
      if (node.linkedTo) {
        html += `<a href="#" class="cross-link" onclick="event.stopPropagation(); selectFamily('${node.linkedTo.familyId}')">${node.linkedTo.text} 🔗</a>`;
      }
      html += `</div>`;

      if (hasChildren) {
        html += `<div class="children-group ${isRoot ? '' : 'hidden'}">`;
        if (node.wives) {
          node.wives.forEach(wife => {
            html += `<div class="wife-section">`;
            html += `<div class="wife-title">💍 ${wife.wifeName}</div>`;
            if (wife.children) {
              wife.children.forEach(child => html += renderNode(child));
            }
            html += `</div>`;
          });
        } else if (node.children) {
          node.children.forEach(child => html += renderNode(child));
        }
        html += `</div>`;
      }

      html += `</li></ul>`;
      return html;
    }

    function toggleChildren(element) {
      const parentLi = element.parentElement;
      const group = parentLi.querySelector('.children-group');
      if (group) {
        group.classList.toggle('hidden');
        parentLi.classList.toggle('expanded');
      }
    }

    function collapseAll() {
      document.querySelectorAll('.children-group').forEach(g => g.classList.add('hidden'));
      document.querySelectorAll('.expanded').forEach(e => e.classList.remove('expanded'));
    }

    function searchPerson() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const nodes = document.querySelectorAll('.person-node');
      
      nodes.forEach(n => {
        n.classList.remove('highlight');
        if (query && n.innerText.toLowerCase().includes(query)) {
          n.classList.add('highlight');
          let parent = n.parentElement;
          while (parent) {
            if (parent.classList && parent.classList.contains('children-group')) {
              parent.classList.remove('hidden');
            }
            parent = parent.parentElement;
          }
        }
      });
    }

    renderCards();
  </script>
</body>
</html>
