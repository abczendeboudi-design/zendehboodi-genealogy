<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شجره‌نامه قباکلکی</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f0e6;
      color: #173f2b;
    }

    header {
      background: #174d36;
      color: white;
      padding: 28px 18px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    header h1 {
      margin: 0;
      font-size: 25px;
      line-height: 1.8;
    }

    header p {
      margin: 8px 0 0;
      color: #dcebdd;
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: 25px auto 50px;
    }

    .search-box {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.08);
      margin-bottom: 22px;
    }

    .search-box label {
      display: block;
      margin-bottom: 10px;
      font-weight: bold;
      color: #174d36;
    }

    #searchInput {
      width: 100%;
      padding: 15px 17px;
      border: 2px solid #d7dfd5;
      border-radius: 13px;
      outline: none;
      font-size: 16px;
      font-family: inherit;
      background: #fafbf8;
    }

    #searchInput:focus {
      border-color: #43815f;
      background: white;
    }

    .family-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: #fffdf8;
      border: 1px solid #e2dfd2;
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 18px;
      box-shadow: 0 7px 22px rgba(0,0,0,0.08);
      transition: 0.2s;
    }

    .family-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.12);
    }

    .family-icon {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .family-card h2 {
      margin: 5px 0 10px;
      font-size: 21px;
      color: #174d36;
      line-height: 1.8;
    }

    .family-card p {
      margin: 6px 0;
      color: #5e6d62;
      line-height: 1.9;
      font-size: 14px;
    }

    .open-button {
      display: inline-block;
      margin-top: 15px;
      padding: 11px 20px;
      border-radius: 12px;
      background: #286747;
      color: white;
      font-size: 14px;
    }

    #searchResults {
      display: none;
      margin-bottom: 22px;
    }

    .results-title {
      font-weight: bold;
      margin: 0 0 12px;
      color: #174d36;
    }

    .person-result {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: white;
      border-radius: 15px;
      padding: 14px 16px;
      margin-bottom: 10px;
      text-decoration: none;
      color: #173f2b;
      border: 1px solid #e3e7df;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .person-result:hover {
      background: #f7faf5;
      border-color: #9ab69f;
    }

    .person-name {
      font-weight: bold;
      font-size: 16px;
    }

    .person-type {
      font-size: 12px;
      color: #718076;
      margin-top: 4px;
    }

    .arrow {
      font-size: 20px;
      color: #286747;
    }

    .no-result {
      background: white;
      padding: 18px;
      border-radius: 15px;
      color: #777;
      text-align: center;
      border: 1px solid #e5e5e5;
    }

    footer {
      text-align: center;
      color: #718076;
      font-size: 12px;
      margin-top: 35px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 21px;
      }

      .container {
        width: 94%;
      }

      .family-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>🌳 شجره‌نامه خاندان غلامحسین قاسم زائر غلامحسین</h1>
  <p>شجره‌نامه خاندان‌های روستای قباکلکی</p>
</header>

<div class="container">

  <div class="search-box">
    <label for="searchInput">🔎 جستجو در شجره‌نامه</label>

    <input
      type="text"
      id="searchInput"
      placeholder="نام شخص یا خاندان را وارد کنید..."
      autocomplete="off"
    >
  </div>

  <div id="searchResults"></div>

  <div id="familyList">

    <a
      href="family.html"
      class="family-card"
      data-search="غلامحسین قاسم زائر غلامحسین پریزاد قاسم خیر محمد زائر عبدالرشید خاندان قباکلکی"
    >

      <div class="family-icon">🌳</div>

      <h2>
        خاندان غلامحسین قاسم زائر غلامحسین
      </h2>

      <p>
        شجره‌نامه خاندان غلامحسین قاسم زائر غلامحسین
      </p>

      <p>
        برای مشاهده شجره‌نامه و افراد این خاندان وارد شوید.
      </p>

      <span class="open-button">
        مشاهده شجره‌نامه ←
      </span>

    </a>

  </div>

  <footer>
    شجره‌نامه قباکلکی
  </footer>

</div>

<script>
  /*

    نام‌ها عمداً بر اساس اطلاعات واردشده در پروژه نگه داشته شده‌اند.
    در این مرحله هدف اصلی، پیدا کردن نام افراد از طریق جستجو است.
  */

  const people = [

    "غلامحسین قاسم زائر غلامحسین",
    "پریزاد",
    "قاسم",
    "ایران ولی",
    "سکینه حیدری",

    "اصغر",
    "حکیمه حاج محمد",
    "علی",
    "رباب",
    "زینب",
    "طالب بهادر",
    "شاهین",
    "شاهرخ",

    "اکبر",
    "روشن میش علی بهادر",
    "لاله",

    "موسی جعفر میش محمدعلی",
    "مهراوه",

    "ژاله",

    "علی جبرئیل",
    "صادق",
    "فریده احمد",
    "کاملیا",
    "صمد",
    "زهرا محمدعلی زائرعباس",
    "نیلوفر",
    "مریلا",

    "فجر",

    "بگم",

    "منیجه",

    "علی",

    "احسان",
    "زبیده",
    "عیسی محمدعلی",

    "حلیمه",
    "خدابخش حاج جعفر عباس",
    "مژگان",
    "پرویز قاسم",
    "فاطمه",
    "فجر احمد",
    "عباس"
  ];


  /*
    حذف نام‌های تکراری برای نمایش نتایج مرتب‌تر
  */
  const uniquePeople = [...new Set(people)];


  const searchInput = document.getElementById("searchInput");
  const searchResults = document.getElementById("searchResults");
  const familyList = document.getElementById("familyList");


  /*
    چند نام اصلی که در person.html فعلاً صفحه اختصاصی دارند.
    برای این نام‌ها لینک مستقیم ساخته می‌شود.
  */
  const profileNames = new Set([
    "قاسم",
    "اصغر",
    "اکبر",
    "پرویز",
    "جهانگیر",
    "شیرین",
    "غلامحسین",
    "مریم",
    "امیر",
    "احمد",
    "ناصر",
    "بگم",
    "سوگل",
    "منیجه",
    "حلیمه"
  ]);


  function normalizeText(text) {
    return text
      .toLowerCase()
      .replace(/ي/g, "ی")
      .replace(/ى/g, "ی")
      .replace(/ك/g, "ک")
      .replace(/ۀ/g, "ه")
      .replace(/\s+/g, " ")
      .trim();
  }


  function createResult(person) {

    const result = document.createElement("a");

    result.className = "person-result";

    /*
      فقط افرادی که در person.html صفحه اختصاصی دارند
      فعلاً قابل ورود مستقیم هستند.
    */
    if (profileNames.has(person)) {
      result.href =
        "person.html?name=" + encodeURIComponent(person);
    } else {
      result.href = "members.html";
    }

    const textBox = document.createElement("div");

    const name = document.createElement("div");
    name.className = "person-name";
    name.textContent = person;

    const type = document.createElement("div");
    type.className = "person-type";

    if (profileNames.has(person)) {
      type.textContent = "مشاهده صفحه این شخص";
    } else {
      type.textContent = "مشاهده در شجره‌نامه";
    }

    textBox.appendChild(name);
    textBox.appendChild(type);

    const arrow = document.createElement("div");
    arrow.className = "arrow";
    arrow.textContent = "←";

    result.appendChild(textBox);
    result.appendChild(arrow);

    return result;
  }


  searchInput.addEventListener("input", function () {

    const query = normalizeText(this.value);

    searchResults.innerHTML = "";

    if (!query) {
      searchResults.style.display = "none";
      familyList.style.display = "block";
      return;
    }

    familyList.style.display = "none";
    searchResults.style.display = "block";

    const matches = uniquePeople.filter(function(person) {
      return normalizeText(person).includes(query);
    });


    const title = document.createElement("div");
    title.className = "results-title";
    title.textContent =
      matches.length + " نتیجه برای جستجوی شما";

    searchResults.appendChild(title);


    if (matches.length === 0) {

      const noResult = document.createElement("div");

      noResult.className = "no-result";

      noResult.textContent =
        "شخصی با این نام پیدا نشد.";

      searchResults.appendChild(noResult);

      return;
    }


    matches.forEach(function(person) {
      searchResults.appendChild(
        createResult(person)
      );
    });

  });

</script>

</body>
</html>
