<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شجره‌نامه جامع خاندان قباکلکی (زنده‌بودی‌ها)</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #0d9488;
      --accent: #d97706;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
    }
    body {
      font-family: Tahoma, Vazir, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      line-height: 1.6;
    }
    header {
      text-align: center;
      margin-bottom: 25px;
    }
    .search-box {
      width: 100%;
      max-width: 450px;
      padding: 12px 18px;
      border: 2px solid #cbd5e1;
      border-radius: 25px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box:focus { border-color: var(--secondary); }
    
    .family-cards {
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      width: 300px;
      cursor: pointer;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      text-align: center;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.12);
    }
    .card h3 { margin: 0 0 10px 0; color: var(--primary); font-size: 18px; }
    .badge {
      background: var(--secondary);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    /* درخت شجره‌نامه */
    .tree-container {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      max-width: 1100px;
      margin: 0 auto;
    }
    .tree-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .back-btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      transition: background-color 0.2s;
    }
    .back-btn:hover { background-color: #1e40af; }

    .tree-header {
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    ul.tree, ul.tree ul {
      list-style: none;
      padding-right: 20px;
      margin: 0;
    }
    ul.tree li {
      margin: 10px 0;
      position: relative;
    }
    .person-node {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-weight: bold;
      transition: background 0.2s;
    }
    .person-node:hover { background: #e2e8f0; }
    .person-name {
      cursor: pointer;
      color: var(--primary);
    }
    .person-name:hover {
      text-decoration: underline;
    }
    .toggle-btn {
      cursor: pointer;
      font-size: 11px;
      background: #cbd5e1;
      padding: 2px 6px;
      border-radius: 4px;
      user-select: none;
    }
    .toggle-btn:hover { background: #94a3b8; color: white; }
    
    .wife-section {
      margin-top: 10px;
      margin-right: 20px;
      border-right: 3px solid var(--accent);
      padding-right: 12px;
    }
    .wife-title {
      color: var(--accent);
      font-size: 14px;
      font-weight: bold;
      margin: 8px 0;
    }
    .hidden { display: none !important; }
    .cross-link {
      font-size: 11px;
      background: #e0e7ff;
      color: #3730a3;
      padding: 2px 8px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: normal;
      margin-right: 6px;
    }
    .cross-link:hover { background: #c7d2fe; }
    .highlight { background: #fef08a !important; border-color: #facc15; }

    /* مدال مشخصات فرد */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(3px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-card {
      background: white;
      border-radius: 16px;
      width: 90%;
      max-width: 400px;
      padding: 25px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      position: relative;
      text-align: center;
      animation: modalFadeIn 0.2s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-close {
      position: absolute;
      top: 12px;
      left: 15px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #64748b;
    }
    .modal-close:hover { color: #0f172a; }
    .profile-avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 15px auto;
      border: 4px solid var(--secondary);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      background-color: #e2e8f0;
      display: block;
    }
    .profile-name {
      font-size: 18px;
      color: var(--primary);
      margin: 0 0 15px 0;
    }
    .info-list {
      text-align: right;
      border-top: 1px solid #f1f5f9;
      padding-top: 15px;
    }
    .info-item {
      display: flex;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .info-label {
      font-weight: bold;
      color: #475569;
      width: 100px;
      flex-shrink: 0;
    }
    .info-value {
      color: #0f172a;
      flex-grow: 1;
    }

      if (node.wives) {
        node.wives.forEach(w => {
          if (w.children) w.children.forEach(c => count += countMembers(c));
        });
      }
      if (node.children) {
        node.children.forEach(c => count += countMembers(c));
      }
      return count;
    }

    function renderCards() {
      const container = document.getElementById('familyCards');
      container.innerHTML = '';
      familiesData.forEach(fam => {
        const count = countMembers(fam.root);
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => selectFamily(fam.id);
        card.innerHTML = `
          <h3>${fam.title}</h3>
          <span class="badge">تعداد ثبت‌شده: ${count} نفر</span>
        `;
        container.appendChild(card);
      });
    }

    function selectFamily(familyId) {
      const fam = familiesData.find(f => f.id === familyId);
      if (!fam) return;

      document.getElementById('familyCards').classList.add('hidden');
      document.getElementById('treeContainer').classList.remove('hidden');
      document.getElementById('currentFamilyTitle').innerText = fam.title;
      
      const treeView = document.getElementById('treeView');
      treeView.innerHTML = renderNode(fam.root, true);
      
      location.hash = familyId;
      window.scrollTo(0, 0);
    }

    function goBack() {
      document.getElementById('treeContainer').classList.add('hidden');
      document.getElementById('familyCards').classList.remove('hidden');
      location.hash = '';
      window.scrollTo(0, 0);
    }

    function renderNode(node, isRoot = false) {
      const pid = 'p_' + (idCounter++);
      personsMap[pid] = node;

      const hasChildren = (node.children && node.children.length > 0) || (node.wives && node.wives.length > 0);
      let html = `<ul class="tree"><li>`;
      
      html += `<div class="person-node">`;
      html += `<span class="person-name" onclick="showProfile('${pid}')">${node.name}</span>`;

      if (node.linkedTo) {
        html += `<a href="#${node.linkedTo.familyId}" class="cross-link" onclick="event.stopPropagation(); selectFamily('${node.linkedTo.familyId}')">${node.linkedTo.text} 🔗</a>`;
      }

      if (hasChildren) {
        html += `<span class="toggle-btn" onclick="toggleChildren(this)">${isRoot ? '➖' : '➕'}</span>`;
      }
      
      html += `</div>`;

      if (hasChildren) {
        html += `<div class="children-group ${isRoot ? '' : 'hidden'}">`;
        if (node.wives) {
          node.wives.forEach(wife => {
            html += `<div class="wife-section">`;
            html += `<div class="wife-title">💍 ${wife.wifeName}</div>`;
            if (wife.children) {
              wife.children.forEach(child => html += renderNode(child));
            }
            html += `</div>`;
          });
        } else if (node.children) {
          node.children.forEach(child => html += renderNode(child));
        }
        html += `</div>`;
      }

      html += `</li></ul>`;
      return html;
    }

    function toggleChildren(element) {
      const parentLi = element.closest('li');
      const group = parentLi.querySelector('.children-group');
      if (group) {
        group.classList.toggle('hidden');
        element.innerText = group.classList.contains('hidden') ? '➕' : '➖';
      }
    }

    function collapseAll() {
      document.querySelectorAll('.children-group').forEach(g => g.classList.add('hidden'));
      document.querySelectorAll('.toggle-btn').forEach(btn => btn.innerText = '➕');
    }

    /* مدیریت مدال مشخصات فرد */
    function showProfile(pid) {
      const person = personsMap[pid];
      if (!person) return;

      document.getElementById('mName').innerText = person.name || 'نامشخص';
      document.getElementById('mEducation').innerText = person.education || 'ثبت نشده';
      document.getElementById('mJob').innerText = person.job || 'ثبت نشده';
      document.getElementById('mBio').innerText = person.bio || 'توضیحات بیشتری وارد نشده است.';
      document.getElementById('mPhoto').src = person.photo && person.photo.trim() !== '' ? person.photo : DEFAULT_AVATAR;

      document.getElementById('profileModal').classList.remove('hidden');
    }

    function closeProfile() {
      document.getElementById('profileModal').classList.add('hidden');
    }

    function closeProfileOnOverlay(event) {
      if (event.target.id === 'profileModal') {
        closeProfile();
      }
    }

    function searchPerson() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const nameElements = document.querySelectorAll('.person-name');
      
      nameElements.forEach(el => {
        const nodeDiv = el.parentElement;
        nodeDiv.classList.remove('highlight');
        if (query && el.innerText.toLowerCase().includes(query)) {
          nodeDiv.classList.add('highlight');
          let parent = nodeDiv.parentElement;
          while (parent) {
            if (parent.classList && parent.classList.contains('children-group')) {
              parent.classList.remove('hidden');
              const toggleBtn = parent.parentElement.querySelector('.toggle-btn');
              if (toggleBtn) toggleBtn.innerText = '➖';
            }
            parent = parent.parentElement;
          }
        }
      });
    }

    window.addEventListener('hashchange', checkHash);
    
    function checkHash() {
      const hash = location.hash.replace('#', '');
      if (hash) {
        selectFamily(hash);
      } else {
        goBack();
      }
    }

    renderCards();
    checkHash();
  </script>
</body>
</html>
