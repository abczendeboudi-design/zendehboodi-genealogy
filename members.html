<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>شجره‌نامه خاندان غلامحسین قاسم</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4eedf;
      color: #243b2a;
      line-height: 1.9;
    }

    header {
      background: #174b32;
      color: white;
      padding: 22px 16px;
      text-align: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 23px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      opacity: 0.9;
    }

    .back {
      display: inline-block;
      margin-top: 15px;
      padding: 9px 18px;
      background: #f4eedf;
      color: #174b32;
      text-decoration: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 0 15px 50px;
    }

    /* -------------------------
       کارت ریشه
    ------------------------- */

    .root-card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 1px solid #ddd2bc;
      margin-bottom: 25px;
    }

    .root-card h2 {
      margin: 0;
      color: #174b32;
      font-size: 22px;
    }

    /* -------------------------
       عنوان شاخه
    ------------------------- */

    .branch-title {
      background: #d9c28f;
      color: #173f2c;
      border-radius: 15px;
      padding: 13px 18px;
      margin: 30px 0 18px;
      font-size: 19px;
      font-weight: bold;
      text-align: center;
      border: 1px solid #c9ae72;
    }

    /* -------------------------
       خانواده
    ------------------------- */

    .family-section {
      background: rgba(255,255,255,0.70);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 22px;
      border: 1px solid #ddd2bc;
    }

    .spouse-title {
      background: #174b32;
      color: white;
      border-radius: 14px;
      padding: 13px 16px;
      margin-bottom: 16px;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
    }

    .mother-info {
      text-align: center;
      margin-bottom: 15px;
      color: #555;
      font-size: 14px;
    }

    /* -------------------------
       کارت شخص
    ------------------------- */

    .person-card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ded5c5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .person-link {
      display: block;
      text-decoration: none;
      color: #174b32;
      font-size: 17px;
      font-weight: bold;
      text-align: center;
      padding: 8px;
    }

    .person-link:hover {
      background: #f4eedf;
      border-radius: 10px;
    }

    /* -------------------------
       فرزندان
    ------------------------- */

    .children {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .child {
      background: #f8f4ea;
      border: 1px solid #ddd2bc;
      border-radius: 12px;
      padding: 10px;
      transition: 0.2s;
    }

    .child:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.07);
    }

    .child a {
      display: block;
      text-decoration: none;
      color: #285f40;
      font-weight: bold;
      text-align: center;
    }

    /* -------------------------
       نسل‌های بعدی
    ------------------------- */

    .sub-family {
      margin-top: 18px;
      padding: 15px;
      background: #fffdf8;
      border: 1px solid #e1d8c7;
      border-radius: 15px;
    }

    .sub-title {
      text-align: center;
      color: #174b32;
      font-weight: bold;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .spouse-line {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    /* -------------------------
       یادداشت
    ------------------------- */

    .note {
      text-align: center;
      margin-top: 30px;
      color: #666;
      font-size: 13px;
      background: #edf2e9;
      border-radius: 14px;
      padding: 15px;
      border: 1px solid #d5ddcf;
    }

    /* -------------------------
       موبایل
    ------------------------- */

    @media (max-width: 600px) {

      header h1 {
        font-size: 19px;
      }

      .container {
        padding: 0 10px 40px;
      }

      .children {
        grid-template-columns: repeat(2, 1fr);
      }

      .family-section {
        padding: 13px;
      }

      .branch-title {
        font-size: 17px;
      }

      .spouse-title {
        font-size: 15px;
      }

      .person-link {
        font-size: 15px;
      }

    }

  </style>
</head>
